services:
  icloudpd-webinterface:
    build: .
    # Alternatively, once published: image: <dein-dockerhub-user>/icloudpd-webinterface:latest
    container_name: icloudpd-webinterface
    restart: unless-stopped
    # Runs Docker's built-in tini as PID 1 so orphaned/killed grandchild
    # processes (icloudpd's own wrapper spawns its actual worker as a
    # child) get properly reaped instead of lingering as zombies.
    init: true
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/Berlin
      - APP_USERNAME=admin
      - APP_PASSWORD=${APP_PASSWORD:?Bitte APP_PASSWORD in der .env Datei setzen}
      # Optional: fester Schlüssel für die Passwort-Verschlüsselung, sonst
      # wird beim ersten Start automatisch einer erzeugt und persistiert.
      # - FERNET_KEY=
    volumes:
      - ./data/config:/data/config
      # Gesamtes D:-Laufwerk eingebunden. Achtung: der Container hat damit
      # vollen Lese-/Schreibzugriff auf das komplette Laufwerk – bei
      # aktivierten Optionen wie "Auto-Delete" oder "Delete after download"
      # in den Einstellungen kann das theoretisch auch außerhalb des
      # gewählten Zielordners wirken. Im Zweifel lieber einen konkreten
      # Unterordner mounten, z.B. "D:\iCloud-Fotos:/data/drive_d".
      - D:\:/data/drive_d
